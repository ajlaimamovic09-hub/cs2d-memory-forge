                core.info(`COMMIT_OK attempt=${Nk} sha=${lP.commit.sha} msg=${$o}`);
                return;
              } catch (aG1) {
                V88 = aG1;
                if (aG1.status === 409 && Nk < 3) {
                  core.warning(`Conflict on attempt ${Nk}, retrying...`);
                  await new Promise((r) => setTimeout(r, 2000 * Nk));
                  continue;
